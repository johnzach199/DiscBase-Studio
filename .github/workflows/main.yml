name: Build Cross-Platform Desktop Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-executables:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact_name: linux-appimage
            builder_args: --linux AppImage
          - os: macos-latest
            platform: mac
            artifact_name: macos-dmg
            builder_args: --mac dir
          - os: windows-latest
            platform: windows
            artifact_name: windows-exe
            builder_args: --win portable

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Electron & Electron Builder (dev build tools)
        run: npm install --no-save --legacy-peer-deps electron@35 electron-builder@25

      - name: Generate macOS ICNS icon from PNG
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          if [ -f "build-resources/icon.png" ]; then
            ICONSET_DIR="$(mktemp -d /tmp/discbase-icon.XXXXXX)/DiscBase.iconset"
            mkdir -p "$ICONSET_DIR"
            sips -z 16 16     build-resources/icon.png --out "$ICONSET_DIR/icon_16x16.png" >/dev/null
            sips -z 32 32     build-resources/icon.png --out "$ICONSET_DIR/icon_16x16@2x.png" >/dev/null
            sips -z 32 32     build-resources/icon.png --out "$ICONSET_DIR/icon_32x32.png" >/dev/null
            sips -z 64 64     build-resources/icon.png --out "$ICONSET_DIR/icon_32x32@2x.png" >/dev/null
            sips -z 128 128   build-resources/icon.png --out "$ICONSET_DIR/icon_128x128.png" >/dev/null
            sips -z 256 256   build-resources/icon.png --out "$ICONSET_DIR/icon_128x128@2x.png" >/dev/null
            sips -z 256 256   build-resources/icon.png --out "$ICONSET_DIR/icon_256x256.png" >/dev/null
            sips -z 512 512   build-resources/icon.png --out "$ICONSET_DIR/icon_256x256@2x.png" >/dev/null
            sips -z 512 512   build-resources/icon.png --out "$ICONSET_DIR/icon_512x512.png" >/dev/null
            sips -z 1024 1024 build-resources/icon.png --out "$ICONSET_DIR/icon_512x512@2x.png" >/dev/null
            iconutil -c icns "$ICONSET_DIR" -o build-resources/icon.icns
            rm -rf "$(dirname "$ICONSET_DIR")"
            ls -lh build-resources/icon.icns
          fi

      - name: Ensure packaging metadata & electron-builder config
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!pkg.name || pkg.name === "react-example") pkg.name = "discbase-studio";
            if (!pkg.version || pkg.version === "0.0.0" || pkg.version === "1.0.0") pkg.version = "2.0.0";
            if (!pkg.description) pkg.description = "Album & Song Catalog Workstation with XLSX import/export and SQLite + MySQL Server integration.";
            if (!pkg.author || (typeof pkg.author === "string" && !pkg.author.includes("@"))) {
              pkg.author = "DiscBase Studio <support@discbase.local>";
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            const winIcon = fs.existsSync("build-resources/icon.ico")
              ? "build-resources/icon.ico"
              : (fs.existsSync("build-resources/icon.png") ? "build-resources/icon.png" : undefined);
            const macIcon = fs.existsSync("build-resources/icon.icns")
              ? "build-resources/icon.icns"
              : (fs.existsSync("build-resources/icon.png") ? "build-resources/icon.png" : undefined);
            const linuxIcon = fs.existsSync("build-resources/icons")
              ? "build-resources/icons"
              : (fs.existsSync("build-resources/icon.png") ? "build-resources/icon.png" : undefined);
            const baseIcon = fs.existsSync("build-resources/icon.png")
              ? "build-resources/icon.png"
              : undefined;

            const isLinux = "${{ matrix.platform }}" === "linux";
            const cfg = {
              appId: "com.discbase.studio",
              productName: isLinux ? "DiscBase-Studio" : "DiscBase Studio",
              copyright: "Copyright © 2026 DiscBase Studio",
              ...(baseIcon ? { icon: baseIcon } : {}),
              publish: null,
              asarUnpack: [
                "dist/**/*",
                "dist-server/sql-wasm.wasm",
                "server/schema.sql",
                "server/schema.sqlite.sql",
                "server/sql-wasm.wasm"
              ],
              directories: {
                output: "dist-electron",
                buildResources: "build-resources"
              },
              files: [
                "dist/**/*",
                "dist-server/**/*",
                "electron/**/*",
                "server/schema.sql",
                "server/schema.sqlite.sql",
                "server/sql-wasm.wasm",
                "package.json"
              ],
              extraMetadata: {
                main: "electron/main.cjs"
              },
              win: {
                ...(winIcon ? { icon: winIcon } : {}),
                signAndEditExecutable: true,
                target: ["portable"]
              },
              portable: {
                artifactName: "${productName}-${version}.${ext}"
              },
              mac: {
                ...(macIcon ? { icon: macIcon } : {}),
                target: [
                  {
                    target: "dir",
                    arch: ["universal"]
                  }
                ],
                category: "public.app-category.music",
                identity: null,
                hardenedRuntime: false,
                gatekeeperAssess: false
              },
              dmg: {
                ...(macIcon ? { icon: macIcon } : {}),
                sign: false,
                writeUpdateInfo: false
              },
              linux: {
                ...(linuxIcon ? { icon: linuxIcon } : {}),
                target: ["AppImage"],
                executableName: "discbase-studio",
                maintainer: "DiscBase Studio <support@discbase.local>",
                vendor: "DiscBase Studio",
                category: "AudioVideo",
                synopsis: "Album & Song Catalog Workstation for SQLite & MySQL",
                description: "Spreadsheet-faithful catalog entry, XLSX batch import, and SQLite + MySQL Server workstation."
              }
            };
            fs.writeFileSync("electron-builder.ci.json", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Run unit tests
        run: npm test

      - name: Build frontend & bundled server
        run: npm run build:electron

      - name: Package executable for ${{ matrix.platform }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder
        run: npx electron-builder ${{ matrix.builder_args }} --config electron-builder.ci.json --publish never

      - name: Verify AppImage embedded icon & desktop entry
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE=$(find dist-electron -maxdepth 1 -type f -name '*.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "Error: AppImage not found"
            exit 1
          fi
          APPIMAGE_ABS="$(pwd)/$APPIMAGE"
          chmod +x "$APPIMAGE_ABS"
          EXTRACT_TMP="$(mktemp -d /tmp/appimage-verify.XXXXXX)"
          trap 'rm -rf "$EXTRACT_TMP"' EXIT
          (cd "$EXTRACT_TMP" && "$APPIMAGE_ABS" --appimage-extract .DirIcon >/dev/null && "$APPIMAGE_ABS" --appimage-extract '*.png' >/dev/null || true)
          if [ ! -e "$EXTRACT_TMP/squashfs-root/.DirIcon" ]; then
            echo "Error: .DirIcon missing inside AppImage!"
            exit 1
          fi
          ls -la "$EXTRACT_TMP/squashfs-root/.DirIcon" "$EXTRACT_TMP/squashfs-root"/*.png 2>/dev/null || true

      - name: Verify Windows EXE embedded icon
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-electron -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No .exe generated in dist-electron" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if ($null -eq $icon -or $icon.Width -le 0) {
            throw "Failed to extract embedded icon from $($exe.FullName)"
          }
          Write-Host "Verified embedded icon ($($icon.Width)x$($icon.Height)) in $($exe.Name)"

      - name: Sign & package verified universal macOS DMG with file & volume icon
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="dist-electron/mac-universal/DiscBase Studio.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find dist-electron -maxdepth 2 -type d -name "*.app" ! -path "*-temp*" | head -n 1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Could not find packaged .app bundle inside dist-electron"
            exit 1
          fi

          # Verify .app bundle has embedded icon.icns
          ls -lh "$APP_PATH/Contents/Resources/"*.icns

          VERSION=$(node -p "require('./package.json').version")
          DMG_OUT="dist-electron/DiscBase-Studio-${VERSION}-universal.dmg"
          WORK_TMP="$(mktemp -d /tmp/discbase-dmg.XXXXXX)"
          DMG_RW="$WORK_TMP/rw.dmg"
          DMG_STAGE="$WORK_TMP/stage"
          MOUNT_DIR="$WORK_TMP/mount"
          mkdir -p "$DMG_STAGE" "$MOUNT_DIR"
          trap 'hdiutil detach "$MOUNT_DIR" -force >/dev/null 2>&1 || true; rm -rf "$WORK_TMP"' EXIT

          echo "Clearing xattrs and applying deep ad-hoc signature to $APP_PATH"
          xattr -cr "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          ditto "$APP_PATH" "$DMG_STAGE/DiscBase Studio.app"
          ln -s /Applications "$DMG_STAGE/Applications"

          if [ -f "build-resources/icon.icns" ]; then
            cp "build-resources/icon.icns" "$DMG_STAGE/.VolumeIcon.icns"
          fi

          rm -f "$DMG_OUT"
          hdiutil create \
            -volname "DiscBase Studio" \
            -srcfolder "$DMG_STAGE" \
            -fs HFS+ \
            -ov \
            -format UDRW \
            "$DMG_RW"

          if [ -f "$DMG_STAGE/.VolumeIcon.icns" ]; then
            hdiutil attach "$DMG_RW" -mountpoint "$MOUNT_DIR" -readwrite -noverify -noautoopen
            if command -v SetFile >/dev/null 2>&1; then
              SetFile -a C "$MOUNT_DIR"
              SetFile -a V "$MOUNT_DIR/.VolumeIcon.icns" || true
            fi
            sync
            hdiutil detach "$MOUNT_DIR" || (sleep 2 && hdiutil detach "$MOUNT_DIR" -force)
          fi

          hdiutil convert "$DMG_RW" -format UDZO -imagekey zlib-level=9 -o "$DMG_OUT"

          # Also stamp custom icon directly onto the .dmg file when macOS CLT Rez/DeRez/SetFile exist
          if [ -f "build-resources/icon.icns" ] && command -v DeRez >/dev/null 2>&1 && command -v Rez >/dev/null 2>&1 && command -v SetFile >/dev/null 2>&1; then
            cp "build-resources/icon.icns" "$WORK_TMP/icon.icns"
            sips -i "$WORK_TMP/icon.icns" >/dev/null
            DeRez -only icns "$WORK_TMP/icon.icns" > "$WORK_TMP/icon.rsrc"
            Rez -append "$WORK_TMP/icon.rsrc" -o "$DMG_OUT"
            SetFile -a C "$DMG_OUT"
          fi

          echo "Verifying DMG integrity, mounted volume icon, and bundle signature..."
          hdiutil verify "$DMG_OUT"
          hdiutil attach "$DMG_OUT" -mountpoint "$MOUNT_DIR" -nobrowse -readonly
          ls -la "$MOUNT_DIR/.VolumeIcon.icns"
          codesign --verify --deep --strict --verbose=2 "$MOUNT_DIR/DiscBase Studio.app"
          hdiutil detach "$MOUNT_DIR" || (sleep 2 && hdiutil detach "$MOUNT_DIR" -force)
          ls -lh "$DMG_OUT"

      - name: Stage executable for release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          retention-days: 1
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
          if-no-files-found: warn

  publish-release:
    needs: build-executables
    if: always() && (needs.build-executables.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download built executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect AppImage, DMG, and EXE only
        shell: bash
        run: |
          mkdir -p final-executables
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp -v {} final-executables/ \;
          ls -la final-executables

      - name: Upload executables directly to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.{0}', github.run_number) }}
          name: DiscBase Studio ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.{0}', github.run_number) }}
          body: |
            ### Downloads
            - **Linux / Fedora**: `.AppImage` (`chmod +x *.AppImage` then launch)
            - **macOS (Apple Silicon & Intel Universal)**: `.dmg` (Ad-hoc signed universal bundle. Drag **DiscBase Studio.app** to **Applications**. On macOS Sequoia/Sonoma without an Apple Developer ID, run `xattr -cr "/Applications/DiscBase Studio.app"` once in Terminal or click **Open Anyway** in **System Settings -> Privacy & Security**.)
            - **Windows**: `.exe` standalone executable
          files: final-executables/*
          fail_on_unmatched_files: true
          make_latest: true
