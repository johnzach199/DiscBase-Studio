name: Build Cross-Platform Desktop Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-executables:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact_name: fedora-linux-packages
            builder_args: --linux rpm AppImage
          - os: macos-latest
            platform: mac
            artifact_name: macos-packages
            builder_args: --mac dmg zip
          - os: windows-latest
            platform: windows
            artifact_name: windows-packages
            builder_args: --win nsis portable

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Electron & Electron Builder (dev build tools)
        run: npm install --no-save --legacy-peer-deps electron@35 electron-builder@25

      - name: Install RPM build tools for Fedora .rpm
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm binutils xz-utils

      - name: Ensure packaging metadata & electron-builder config
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!pkg.name || pkg.name === "react-example") pkg.name = "discbase-studio";
            if (!pkg.version || pkg.version === "0.0.0") pkg.version = "1.0.0";
            if (!pkg.description) pkg.description = "Album & Song Catalog Workstation with XLSX import/export and MySQL Server integration.";
            if (!pkg.author || (typeof pkg.author === "string" && !pkg.author.includes("@"))) {
              pkg.author = "DiscBase Studio <support@discbase.local>";
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            const isLinux = "${{ matrix.platform }}" === "linux";
            const cfg = {
              appId: "com.discbase.studio",
              productName: isLinux ? "DiscBase-Studio" : "DiscBase Studio",
              copyright: "Copyright © 2026 DiscBase Studio",
              publish: null,
              directories: {
                output: "dist-electron",
                buildResources: "build-resources"
              },
              files: [
                "dist/**/*",
                "dist-server/server.cjs",
                "electron/**/*",
                "server/schema.sql",
                "package.json"
              ],
              extraMetadata: {
                main: "electron/main.cjs"
              },
              win: {
                target: ["nsis", "portable"]
              },
              mac: {
                target: ["dmg", "zip"],
                category: "public.app-category.music"
              },
              linux: {
                target: ["AppImage", "rpm"],
                executableName: "discbase-studio",
                maintainer: "DiscBase Studio <support@discbase.local>",
                vendor: "DiscBase Studio",
                category: "AudioVideo",
                synopsis: "Album & Song Catalog Workstation for MySQL",
                description: "Spreadsheet-faithful catalog entry, XLSX batch import, and MySQL Server workstation."
              },
              rpm: {
                compression: "gz",
                fpm: [
                  "--rpm-rpmbuild-define=_build_id_links none",
                  "--rpm-rpmbuild-define=debug_package %{nil}"
                ]
              }
            };
            fs.writeFileSync("electron-builder.ci.json", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Run unit tests
        run: npm test

      - name: Build frontend & bundled server
        run: npm run build:electron

      - name: Package executable for ${{ matrix.platform }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder
        run: npx electron-builder ${{ matrix.builder_args }} --config electron-builder.ci.json --publish never

      - name: Upload built executables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.rpm
            dist-electron/*.AppImage
          if-no-files-found: warn
