appId: com.discbase.studio
productName: DiscBase Studio
copyright: Copyright © 2026 DiscBase Studio
icon: build-resources/icon.png
publish: null
asarUnpack:
  - dist/**/*
  - dist-server/sql-wasm.wasm
  - server/schema.sql
  - server/schema.sqlite.sql
  - server/sql-wasm.wasm
directories:
  output: dist-electron
  buildResources: build-resources
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - server/schema.sql
  - server/schema.sqlite.sql
  - server/sql-wasm.wasm
  - package.json
extraMetadata:
  main: electron/main.cjs
afterPack: electron/afterPack.cjs
win:
  icon: build-resources/icon.ico
  signAndEditExecutable: true
  target:
    - portable
portable:
  artifactName: ${productName}-${version}.${ext}
mac:
  icon: build-resources/icon.icns
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.music
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  icon: build-resources/icon.icns
  sign: false
  writeUpdateInfo: false
linux:
  icon: build-resources/icons
  target:
    - AppImage
  executableName: discbase-studio
  maintainer: DiscBase Studio <support@discbase.local>
  vendor: DiscBase Studio
  category: AudioVideo
  synopsis: Album & Song Catalog Workstation for SQLite & MySQL
  description: Spreadsheet-faithful catalog entry, XLSX batch import, and SQLite + MySQL Server workstation.
